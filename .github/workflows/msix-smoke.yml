name: MSIX Smoke Test

on:
  push:
    paths:
      - ".github/workflows/msix-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller pillow

      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Yonsei-Paper-Downloader" paper_downloader_app.py

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "msix-package\Assets" | Out-Null
          Copy-Item "dist\Yonsei-Paper-Downloader.exe" "msix-package\Yonsei-Paper-Downloader.exe"
          python scripts/generate_msix_assets.py "msix-package\Assets"
          python scripts/render_msix_manifest.py `
            --template "msix\AppxManifest.template.xml" `
            --output "msix-package\AppxManifest.xml" `
            --identity-name "GunKuk.YonseiPaperDownloader.Test" `
            --publisher "CN=00000000-0000-0000-0000-000000000000" `
            --publisher-display-name "Gun Kuk" `
            --display-name "Yonsei Paper Downloader" `
            --version "1.0.0.0"

      - name: Pack MSIX
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw "makeappx.exe not found" }
          & $makeAppx.FullName pack /d "msix-package" /p "Yonsei-Paper-Downloader-Test.msix" /o

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-smoke-test
          path: Yonsei-Paper-Downloader-Test.msix
